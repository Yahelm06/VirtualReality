<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 1.5 -3" rotation="1 30 0" color="#0000FF"></a-box>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#580AA1"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#DE0B3C"></a-sphere>
      <a-sphere position="-5 1.25 -5" radius="1.25" color="#87001B"></a-sphere>
      <a-sphere position="5 1.25 -5" radius="1.25" color="#C72C5A"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#34FF0D"></a-cylinder>
      <a-cylinder position="1 0.75 -2" radius="0.5" height="1.0" color="#27F57D"></a-cylinder>
      <a-cylinder position="1 0.75 -1" radius="0.5" height="0.5" color="#91F527"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#FFDF00"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
